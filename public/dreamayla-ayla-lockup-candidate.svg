<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360" role="img" aria-labelledby="title desc">
  <title id="title">DreamAyla Ayla lockup</title>
  <desc id="desc">A soft A monogram joined to the letters yla.</desc>
  <g transform="translate(72 34)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- A single soft orbit grows out of the A instead of sitting beside it. -->
    <path d="M57 248C11 224 4 160 34 108C66 53 132 30 188 53C222 67 247 91 260 120" stroke="#B6ACD9" stroke-width="25"/>
    <!-- Rounded A gesture: no sharp tip, no eye or literal moon. -->
    <path d="M58 249C86 188 111 130 143 76C151 62 163 62 171 76C204 131 229 188 258 249" stroke="#292E5B" stroke-width="31"/>
    <path d="M92 190C123 176 192 176 224 190" stroke="#292E5B" stroke-width="26"/>
    <!-- The violet trace resolves beneath the rest of Ayla. -->
    <path d="M260 120C276 158 272 202 249 230" stroke="#B6ACD9" stroke-width="25"/>
  </g>
  <!-- The monogram supplies the A; these three letters complete the name. -->
  <text x="343" y="238" fill="#292E5B" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="188" letter-spacing="-15">yla</text>
  <path d="M95 297C312 318 598 317 795 287" fill="none" stroke="#B6ACD9" stroke-width="5" stroke-linecap="round"/>
</svg>
